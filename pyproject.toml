[project]
name = "chap-python-sdk"
version = "0.1.0"
description = "Validation and testing framework for chapkit models"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
keywords = ["chapkit", "climate", "health", "machine-learning", "testing", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "chapkit",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "geojson-pydantic>=1.0",
    "cyclopts>=4.4.4",
    "numpy>=1.22",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/knutdrand/chap-python-sdk"
Documentation = "https://knutdrand.github.io/chap-python-sdk/"
Repository = "https://github.com/knutdrand/chap-python-sdk.git"
Issues = "https://github.com/knutdrand/chap-python-sdk/issues"

[project.scripts]
chap-sdk = "chap_python_sdk.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.11",
    "pyright>=1.1",
    "ruff>=0.5",
    "coverage>=7.0",
]
skforecast = [
    "skforecast>=0.14.0",
    "scikit-learn>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chap_python_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"src/chap_python_sdk/template" = "chap_python_sdk/template"

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = ["--markdown-docs"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnnecessaryIsInstance = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "altair>=6.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pre-commit>=4.5.1",
    "pytest-cov>=7.0.0",
    "pytest-markdown-docs>=0.9.0",
    "vl-convert-python>=1.9.0.post1",
]
